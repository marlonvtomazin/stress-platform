name: stress-platform

services:
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    volumes:
      - ./executions:/executions
      - ./scripts:/scripts
    env_file:
      - .env
    environment:
      K6_INFLUXDB_ADDR: ${K6_INFLUXDB_ADDR}
      K6_INFLUXDB_DB: ${K6_INFLUXDB_DB}
      K6_INFLUXDB_USERNAME: ${K6_INFLUXDB_USERNAME}
      K6_INFLUXDB_PASSWORD: ${K6_INFLUXDB_PASSWORD}

    depends_on:
      - influxdb

  influxdb:
    image: influxdb:2.7
    ports:
      - "8086:8086"
    env_file:
      - .env
    volumes:
      - influxdb-data:/var/lib/influxdb2

  grafana:
    image: grafana/grafana:12.0.2
    ports:
      - "3001:3000"
    env_file:
      - .env
    depends_on:
      - influxdb
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning

volumes:
  influxdb-data:
  grafana-data: